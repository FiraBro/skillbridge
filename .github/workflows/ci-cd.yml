name: CI/CD

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend-go/go.mod
          cache-dependency-path: apps/backend-go/go.sum

      - name: Test Go backend
        working-directory: apps/backend-go
        run: go test ./...

      - name: Build Go backend
        working-directory: apps/backend-go
        run: go build -o /tmp/skillbridge-api ./cmd/api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Build Go backend Docker image
        run: docker build -f infra/docker/backend.Dockerfile -t skillbridge-api:ci apps/backend-go

      - name: Build frontend Docker image
        run: docker build -f infra/docker/frontend.Dockerfile -t skillbridge-web:ci apps/web