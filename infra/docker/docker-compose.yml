services:
  api:
    build:
      context: ../../backend-go
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL database reachable from Docker}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the root .env file}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:?Set JWT_RESET_SECRET in the root .env file}
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:4000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:5173/api/github/auth/github/callback}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_uploads:/app/uploads
  web:
    build: ../../apps/web
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
volumes:
  api_uploads:
