services:
  api:
    build:
      context: ../../backend-go
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://user:password@db:5432/skillbridge?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-access-secret-change-me}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:-local-development-reset-secret-change-me}
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:4000
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ../../apps/web
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d skillbridge"]
      interval: 5s
      timeout: 3s
      retries: 10
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
volumes:
  api_uploads:
